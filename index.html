    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/assets/icon.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #212129;
        font-family: 'Press Start 2P', cursive;
        color: #4c5265;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #212129;
      }
      ::-webkit-scrollbar-thumb {
        background: #40445a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4c5265;
      }
      .pixel-border {
        box-shadow: 
          0 -4px 0 0 #3d3e51,
          0 4px 0 0 #3d3e51,
          -4px 0 0 0 #3d3e51,
          4px 0 0 0 #3d3e51;
      }
      .pixel-border-inward {
        box-shadow: 
          inset 0 -4px 0 0 #3d3e51,
          inset 0 4px 0 0 #3d3e51,
          inset -4px 0 0 0 #3d3e51,
          inset 4px 0 0 0 #3d3e51;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      .parallax-bg {
        pointer-events: none;
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
    </style>
